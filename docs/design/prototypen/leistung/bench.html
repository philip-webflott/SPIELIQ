<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;background:#0b1220}svg{width:100vw;height:100vh;display:block}</style></head>
<body><svg id="s" viewBox="0 0 68 105" preserveAspectRatio="xMidYMid meet"></svg>
<script>
const mode = new URLSearchParams(location.search).get('mode') || 'circles'
const NS = 'http://www.w3.org/2000/svg'
const svg = document.getElementById('s')
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); (parent || svg).appendChild(e); return e }
// Spielfeld mit Linien (wie in der App)
el('rect', { x: 0, y: 0, width: 68, height: 105, fill: '#1f6b3f' })
for (let i = 0; i < 10; i++) el('rect', { x: 0, y: i * 10.5, width: 68, height: 5.25, fill: '#23733f' })
el('rect', { x: 1, y: 1, width: 66, height: 103, fill: 'none', stroke: '#fff', 'stroke-width': 0.15 })
el('line', { x1: 1, y1: 52.5, x2: 67, y2: 52.5, stroke: '#fff', 'stroke-width': 0.15 })
el('circle', { cx: 34, cy: 52.5, r: 9.15, fill: 'none', stroke: '#fff', 'stroke-width': 0.15 })
const players = []
// Sprite-Bilder: 8 Laufphasen je Team, vorab auf Canvas gezeichnet (Daten-URLs)
function spriteFrames(color) {
  const frames = []
  for (let f = 0; f < 8; f++) {
    const c = document.createElement('canvas'); c.width = c.height = 96; const g = c.getContext('2d')
    const sw = Math.sin(f / 8 * Math.PI * 2) * 14
    g.translate(48, 48); g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(0, 6, 22, 14, 0, 0, 7); g.fill()
    g.fillStyle = '#222'; g.fillRect(-12, -4 + sw, 8, 26); g.fillRect(4, -4 - sw, 8, 26)
    g.fillStyle = color; g.beginPath(); g.roundRect(-18, -16, 36, 26, 10); g.fill()
    g.fillStyle = '#f1c27d'; g.fillRect(-26, -10 - sw, 8, 18); g.fillRect(18, -10 + sw, 8, 18)
    g.beginPath(); g.arc(0, -10, 11, 0, 7); g.fillStyle = '#3b2a1a'; g.fill()
    frames.push(c.toDataURL())
  }
  return frames
}
const sprites = mode === 'sprites' ? { own: spriteFrames('#4aa3ff'), opp: spriteFrames('#ff8a3d') } : null
for (let i = 0; i < 22; i++) {
  const team = i < 11 ? 'own' : 'opp'
  const color = team === 'own' ? '#4aa3ff' : '#ff8a3d'
  const g = el('g', {})
  const p = { g, team, cx: 10 + (i % 6) * 10, cy: 10 + Math.floor(i / 6) * 22, r: 3 + (i % 4), phase: i, parts: {} }
  if (mode === 'circles') {
    el('circle', { r: 1.75, fill: 'none', stroke: '#ffe3cc', 'stroke-width': 0.2 }, g)
    el('circle', { r: 1.3, fill: color, stroke: '#eaf4ff', 'stroke-width': 0.35 }, g)
    const t = el('text', { 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': 1.3, 'font-weight': 700, fill: '#04213f' }, g); t.textContent = String(i + 1)
  } else if (mode === 'figures') {
    // Stilisierte Figur von oben: Schatten, Beine, Arme, Trikot mit Nummer, Kopf – Beine/Arme schwingen
    el('ellipse', { rx: 2.1, ry: 1.4, cy: 0.5, fill: 'rgba(0,0,0,.25)' }, g)
    const body = el('g', {}, g)
    p.parts.legL = el('rect', { x: -1.2, y: -0.3, width: 0.8, height: 2.6, rx: 0.4, fill: '#1c1c1c' }, body)
    p.parts.legR = el('rect', { x: 0.4, y: -0.3, width: 0.8, height: 2.6, rx: 0.4, fill: '#1c1c1c' }, body)
    p.parts.armL = el('rect', { x: -2.6, y: -1.0, width: 0.8, height: 1.8, rx: 0.4, fill: '#f1c27d' }, body)
    p.parts.armR = el('rect', { x: 1.8, y: -1.0, width: 0.8, height: 1.8, rx: 0.4, fill: '#f1c27d' }, body)
    el('rect', { x: -1.8, y: -1.6, width: 3.6, height: 2.6, rx: 1, fill: color, stroke: '#ffffff', 'stroke-width': 0.18 }, body)
    el('circle', { r: 1.05, cy: -1.0, fill: '#3b2a1a' }, body)
    const t = el('text', { y: 0.35, 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': 1.0, 'font-weight': 700, fill: '#04213f' }, body); t.textContent = String(i + 1)
    p.parts.body = body
  } else {
    p.parts.img = el('image', { x: -2.6, y: -2.6, width: 5.2, height: 5.2, href: sprites[team][0] }, g)
  }
  players.push(p)
}
const ball = el('circle', { r: 0.45, fill: '#fff', stroke: '#111', 'stroke-width': 0.12 })
const frames = []
let last = performance.now(), start = last
function tick(now) {
  frames.push(now - last); last = now
  const t = (now - start) / 1000
  for (const p of players) {
    const a = t * 0.9 + p.phase
    const x = p.cx + Math.cos(a) * p.r, y = p.cy + Math.sin(a) * p.r
    p.g.setAttribute('transform', `translate(${x.toFixed(2)} ${y.toFixed(2)})`)
    if (mode === 'figures') {
      const dir = (a + Math.PI / 2) * 180 / Math.PI
      p.parts.body.setAttribute('transform', `rotate(${dir.toFixed(1)})`)
      const sw = Math.sin(t * 10 + p.phase) * 0.9
      p.parts.legL.setAttribute('transform', `translate(0 ${sw.toFixed(2)})`)
      p.parts.legR.setAttribute('transform', `translate(0 ${(-sw).toFixed(2)})`)
      p.parts.armL.setAttribute('transform', `translate(0 ${(-sw * 0.6).toFixed(2)})`)
      p.parts.armR.setAttribute('transform', `translate(0 ${(sw * 0.6).toFixed(2)})`)
    } else if (mode === 'sprites') {
      const dir = (a + Math.PI / 2) * 180 / Math.PI
      const f = Math.floor((t * 12 + p.phase) % 8)
      p.parts.img.setAttribute('href', sprites[p.team][f])
      p.parts.img.setAttribute('transform', `rotate(${dir.toFixed(1)})`)
    }
  }
  ball.setAttribute('cx', (34 + Math.cos(t * 1.7) * 20).toFixed(2)); ball.setAttribute('cy', (52 + Math.sin(t * 1.3) * 30).toFixed(2))
  if (now - start < 6000) requestAnimationFrame(tick)
  else {
    const f = frames.slice(30).sort((a, b) => a - b)
    const avg = f.reduce((s, v) => s + v, 0) / f.length
    window.__result = { mode, nodes: svg.querySelectorAll('*').length, fps: +(1000 / avg).toFixed(1), p95: +f[Math.floor(f.length * 0.95)].toFixed(1), slow: f.filter((v) => v > 20).length / f.length }
  }
}
requestAnimationFrame(tick)
</script></body></html>
